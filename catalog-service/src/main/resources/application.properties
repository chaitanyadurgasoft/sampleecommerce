# Server configuration
server.port=8081
server.servlet.context-path=/catalog

# Application name
spring.application.name=catalog-service

# Single database configuration with schema
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_db}?currentSchema=${DB_SCHEMA:catalog_schema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:catalog_schema}

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Service URLs and other configuration...
payment.service.url=http://${PAYMENT_SERVICE_HOST:localhost}:8082
login.service.url=http://${LOGIN_SERVICE_HOST:localhost}:8080
logging.level.com.example.catalogservice=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jackson.serialization.indent-output=true
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
