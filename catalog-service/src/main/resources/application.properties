# Development environment configuration
server.port=8081
server.servlet.context-path=/catalog

# Service URLs for development (localhost)
payment.service.url=http://localhost:8082
login.service.url=http://localhost:8080

# Enable debug logging in development
logging.level.org.springframework.web=DEBUG
logging.level.com.example.catalogservice=DEBUG

# Development-specific settings
spring.jackson.serialization.indent-output=true
management.endpoint.health.show-details=always

# Logging configuration
logging.level.com.example.catalogservice=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# JSON configuration
spring.jackson.serialization.indent-output=true

# CORS configuration (allow all origins for development)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# RestTemplate timeout configuration
spring.web.client.connect-timeout=5s
spring.web.client.read-timeout=10s
