# Server configuration
server.port=8082
server.servlet.context-path=/payment

# Application name
spring.application.name=payment-service

# Single database configuration with payment schema
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_db}?currentSchema=${DB_SCHEMA:payment_schema}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:payment_schema}

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Notification service URL
notification.service.url=http://${NOTIFICATION_SERVICE_HOST:localhost}:8083

# Logging configuration
logging.level.com.example.paymentservice=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JSON configuration
spring.jackson.serialization.indent-output=true

# CORS configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Payment simulation settings
payment.simulation.success-rate=0.7
payment.simulation.min-delay=1000
payment.simulation.max-delay=3000

# Application info
info.app.name=Payment Service with Database
info.app.description=Payment processing with PostgreSQL integration
info.app.version=2.0.0
