# Server configuration
server.port=8082
server.servlet.context-path=/payment

# Application name
spring.application.name=payment-service

# Notification service URL (can be overridden by environment variable)
notification.service.url=http://notification-service:8080

# Logging configuration
logging.level.com.example.paymentservice=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# JSON configuration
spring.jackson.serialization.indent-output=true

# CORS configuration (allow all origins for development)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# RestTemplate timeout configuration
spring.web.client.connect-timeout=5s
spring.web.client.read-timeout=10s

# Payment simulation settings
payment.simulation.success-rate=0.7
payment.simulation.min-delay=1000
payment.simulation.max-delay=3000
