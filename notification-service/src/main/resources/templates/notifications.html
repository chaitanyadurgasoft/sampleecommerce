<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 2rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .notification-form {
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .notifications-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .notification-item {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
        }
        
        .message {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📧 Notification Service</h1>
        <p>Send and manage notifications</p>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>📊 Service Statistics</h2>
            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalNotifications">-</div>
                    <div>Total Notifications</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">✅</div>
                    <div>Service Status</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>📤 Send Test Notification</h2>
            <form class="notification-form" id="notificationForm">
                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" value="admin" required>
                </div>
                
                <div class="form-group">
                    <label for="notificationType">Notification Type</label>
                    <select id="notificationType">
                        <option value="general">General</option>
                        <option value="payment_success">Payment Success</option>
                        <option value="payment_failure">Payment Failure</option>
                        <option value="order_update">Order Update</option>
                        <option value="system">System</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="3" placeholder="Enter your notification message..." required></textarea>
                </div>
                
                <button type="submit" class="btn">Send Notification</button>
            </form>
            
            <div id="messageDiv"></div>
        </div>
        
        <div class="card">
            <h2>📋 Recent Notifications</h2>
            <div class="notifications-list" id="notificationsList">
                <p>No notifications found. Send a test notification above.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadNotifications();
        });
        
        document.getElementById('notificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await sendNotification();
        });
        
        async function sendNotification() {
            const userId = document.getElementById('userId').value;
            const message = document.getElementById('message').value;
            const type = document.getElementById('notificationType').value;
            
            try {
                const response = await fetch(`${API_BASE}/notify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, message, type })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showMessage('✅ Notification sent successfully!', 'success');
                    document.getElementById('message').value = '';
                    loadStats();
                    loadNotifications();
                } else {
                    showMessage('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Connection error', 'error');
            }
        }
        
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const stats = await response.json();
                document.getElementById('totalNotifications').textContent = stats.totalNotifications;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }
        
        async function loadNotifications() {
            try {
                const userId = document.getElementById('userId').value;
                const response = await fetch(`${API_BASE}/notifications/${userId}`);
                const notifications = await response.json();
                
                const listElement = document.getElementById('notificationsList');
                
                if (notifications.length === 0) {
                    listElement.innerHTML = '<p>No notifications found for this user.</p>';
                    return;
                }
                
                listElement.innerHTML = notifications.slice(-10).reverse().map(notif => `
                    <div class="notification-item">
                        <div><strong>Type:</strong> ${notif.type || 'general'}</div>
                        <div><strong>Time:</strong> ${new Date(notif.timestamp).toLocaleString()}</div>
                        <div><strong>Message:</strong> ${notif.message}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Failed to load notifications:', error);
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('messageDiv');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
