# Server configuration
server.port=8083
server.servlet.context-path=/

# Application name
spring.application.name=notification-service

# Logging configuration
logging.level.com.example.notificationservice=INFO
logging.level.org.springframework.web=DEBUG

# JSON configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL

# CORS configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,stats
management.endpoint.health.show-details=always

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application info
info.app.name=Notification Service
info.app.description=Notification microservice for e-commerce platform
info.app.version=1.0.0
