# Server configuration
server.port=8080
server.servlet.context-path=/

# Application name
spring.application.name=login-service

# Catalog service URL for redirect after login (configurable)
catalog.service.url=http://localhost:8081

# Logging configuration
logging.level.com.example.loginservice=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# JSON configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL

# CORS configuration (allow all origins for development)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Actuator configuration for monitoring
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Security configuration
spring.security.user.name=admin
spring.security.user.password=password
spring.security.user.roles=USER

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Error handling
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# Thymeleaf configuration (for serving HTML templates)
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Development settings
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Application info (shows up in /actuator/info)
info.app.name=Login Microservice
info.app.description=Authentication service for e-commerce platform
info.app.version=1.0.0
info.app.author=Developer Team
