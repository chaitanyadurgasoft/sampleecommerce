<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 450px;
        }

        .tabs {
            display: flex;
            margin-bottom: 2rem;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-requirements {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .requirement {
            display: flex;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .requirement.valid {
            color: #28a745;
        }

        .requirement.invalid {
            color: #dc3545;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin: 1rem 0;
            font-weight: 500;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .username-check {
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .available {
            color: #28a745;
        }

        .unavailable {
            color: #dc3545;
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">🔐 Login</div>
            <div class="tab" onclick="showTab('register')">📝 Register</div>
        </div>

        <!-- Login Form -->
        <div id="loginContainer" class="form-container active">
            <h1>Welcome Back!</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" name="username" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    Login
                </button>
            </form>

            <div class="form-footer">
                <p>Demo credentials: <strong>admin / password</strong></p>
            </div>
        </div>

        <!-- Registration Form -->
        <div id="registerContainer" class="form-container">
            <h1>Create Account</h1>

            <form id="registerForm">
                <div class="form-group">
                    <label for="registerUsername">Username</label>
                    <input type="text" id="registerUsername" name="username" required minlength="3" maxlength="50">
                    <div id="usernameCheck" class="username-check"></div>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" name="email" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password" required minlength="6">
                    <div class="password-requirements">
                        <div class="requirement" id="lengthReq">
                            <span id="lengthIcon">❌</span> At least 6 characters
                        </div>
                        <div class="requirement" id="letterReq">
                            <span id="letterIcon">❌</span> Contains letters
                        </div>
                        <div class="requirement" id="numberReq">
                            <span id="numberIcon">❌</span> Contains numbers
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <div id="passwordMatch" class="username-check"></div>
                </div>

                <button type="submit" class="btn" id="registerBtn">
                    Create Account
                </button>
            </form>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // Tab switching
        function showTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update form containers
            document.querySelectorAll('.form-container').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Container').classList.add('active');
            
            // Clear messages
            document.getElementById('message').innerHTML = '';
        }

        // Login form handling
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleLogin();
        });

        // Registration form handling
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleRegistration();
        });

        // Username availability checking
        let usernameCheckTimeout;
        document.getElementById('registerUsername').addEventListener('input', (e) => {
            const username = e.target.value;
            
            clearTimeout(usernameCheckTimeout);
            usernameCheckTimeout = setTimeout(() => {
                if (username.length >= 3) {
                    checkUsernameAvailability(username);
                } else {
                    document.getElementById('usernameCheck').innerHTML = '';
                }
            }, 500);
        });

        // Password validation
        document.getElementById('registerPassword').addEventListener('input', validatePassword);
        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

        // Login function
        async function handleLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<div class="loading"></div>Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('authToken', data.token);
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = window.location.protocol + '//' + window.location.hostname + ':8081/catalog/';
                    }, 1500);
                } else {
                    showMessage('❌ ' + (data.message || 'Login failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Connection error. Please try again.', 'error');
            }

            loginBtn.disabled = false;
            loginBtn.innerHTML = 'Login';
        }

        // Registration function
        async function handleRegistration() {
            const registerBtn = document.getElementById('registerBtn');
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('❌ Passwords do not match', 'error');
                return;
            }

            // Validate password requirements
            if (!isPasswordValid(password)) {
                showMessage('❌ Password does not meet requirements', 'error');
                return;
            }

            registerBtn.disabled = true;
            registerBtn.innerHTML = '<div class="loading"></div>Creating Account...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        email, 
                        password, 
                        confirmPassword 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('✅ Account created successfully! You can now login.', 'success');
                    
                    // Switch to login tab and fill username
                    setTimeout(() => {
                        showTab('login');
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('registerForm').reset();
                        clearValidationMessages();
                    }, 2000);
                } else {
                    showMessage('❌ ' + (data.message || 'Registration failed'), 'error');
                }
            } catch (error) {
                showMessage('❌ Connection error. Please try again.', 'error');
            }

            registerBtn.disabled = false;
            registerBtn.innerHTML = 'Create Account';
        }

        // Check username availability
        async function checkUsernameAvailability(username) {
            const checkElement = document.getElementById('usernameCheck');
            
            try {
                const response = await fetch(`/api/check-username/${username}`);
                const data = await response.json();
                
                if (data.available) {
                    checkElement.innerHTML = '✅ Username is available';
                    checkElement.className = 'username-check available';
                } else {
                    checkElement.innerHTML = '❌ Username is already taken';
                    checkElement.className = 'username-check unavailable';
                }
            } catch (error) {
                checkElement.innerHTML = '';
            }
        }

        // Validate password requirements
        function validatePassword() {
            const password = document.getElementById('registerPassword').value;
            
            // Length requirement
            const lengthReq = document.getElementById('lengthReq');
            const lengthIcon = document.getElementById('lengthIcon');
            if (password.length >= 6) {
                lengthReq.className = 'requirement valid';
                lengthIcon.textContent = '✅';
            } else {
                lengthReq.className = 'requirement invalid';
                lengthIcon.textContent = '❌';
            }

            // Letter requirement
            const letterReq = document.getElementById('letterReq');
            const letterIcon = document.getElementById('letterIcon');
            if (/[a-zA-Z]/.test(password)) {
                letterReq.className = 'requirement valid';
                letterIcon.textContent = '✅';
            } else {
                letterReq.className = 'requirement invalid';
                letterIcon.textContent = '❌';
            }

            // Number requirement
            const numberReq = document.getElementById('numberReq');
            const numberIcon = document.getElementById('numberIcon');
            if (/[0-9]/.test(password)) {
                numberReq.className = 'requirement valid';
                numberIcon.textContent = '✅';
            } else {
                numberReq.className = 'requirement invalid';
                numberIcon.textContent = '❌';
            }

            checkPasswordMatch();
        }

        // Check if passwords match
        function checkPasswordMatch() {
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchElement = document.getElementById('passwordMatch');

            if (confirmPassword.length > 0) {
                if (password === confirmPassword) {
                    matchElement.innerHTML = '✅ Passwords match';
                    matchElement.className = 'username-check available';
                } else {
                    matchElement.innerHTML = '❌ Passwords do not match';
                    matchElement.className = 'username-check unavailable';
                }
            } else {
                matchElement.innerHTML = '';
            }
        }

        // Check if password is valid
        function isPasswordValid(password) {
            return password.length >= 6 && 
                   /[a-zA-Z]/.test(password) && 
                   /[0-9]/.test(password);
        }

        // Show message
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            // Auto-hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 5000);
            }
        }

        // Clear validation messages
        function clearValidationMessages() {
            document.getElementById('usernameCheck').innerHTML = '';
            document.getElementById('passwordMatch').innerHTML = '';
            
            // Reset password requirements
            document.querySelectorAll('.requirement').forEach(req => {
                req.className = 'requirement';
                req.querySelector('span').textContent = '❌';
            });
        }

        // Initialize tab switching
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(container => container.classList.remove('active'));
            
            if (tabName === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginContainer').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registerContainer').classList.add('active');
            }
            
            document.getElementById('message').innerHTML = '';
        }
    </script>
</body>
</html>
