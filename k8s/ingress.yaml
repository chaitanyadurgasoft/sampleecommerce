apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  labels:
    app: ecommerce
    component: ingress
  annotations:
    # Remove problematic rewrite rules for API endpoints
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, Accept, X-Requested-With, Cache-Control"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Backend protocol
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    
    # Configuration snippet for better CORS handling
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }
      
spec:
  ingressClassName: nginx
  rules:
  - host: app.testcgit.xyz
    http:
      paths:
      # ===== API ENDPOINTS (Direct routing, no rewrite) =====
      
      # Login Service API endpoints
      - path: /api/login
        pathType: Exact
        backend:
          service:
            name: login-service
            port:
              number: 8080
      - path: /api/register
        pathType: Exact
        backend:
          service:
            name: login-service
            port:
              number: 8080
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 8080
      - path: /api/check-username
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 8080
      
      # Catalog Service API endpoints
      - path: /api/products
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 8081
      - path: /api/categories
        pathType: Exact
        backend:
          service:
            name: catalog-service
            port:
              number: 8081
      - path: /api/buy
        pathType: Exact
        backend:
          service:
            name: catalog-service
            port:
              number: 8081
      - path: /api/stats
        pathType: Exact
        backend:
          service:
            name: catalog-service
            port:
              number: 8081
      
      # Payment Service API endpoints
      - path: /api/payment
        pathType: Exact
        backend:
          service:
            name: payment-service
            port:
              number: 8082
      
      # Notification Service API endpoints
      - path: /api/notify
        pathType: Exact
        backend:
          service:
            name: notification-service
            port:
              number: 8083
      - path: /api/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8083
      
      # Health check endpoints
      - path: /api/health
        pathType: Exact
        backend:
          service:
            name: login-service
            port:
              number: 8080
      
      # ===== WEB PAGES (With rewrite for proper routing) =====
      
      # Login pages
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 8080
      
      # Catalog pages (with rewrite)
      - path: /catalog
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 8081
      
      # Payment pages (with rewrite)
      - path: /payment
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 8082
      
      # Notification pages
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8083
      
      # Actuator endpoints for monitoring
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 8080
      
      # Health check endpoint
      - path: /health
        pathType: Exact
        backend:
          service:
            name: login-service
            port:
              number: 8080
      
      # Default route - Login Service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: login-service
            port:
              number: 8080
